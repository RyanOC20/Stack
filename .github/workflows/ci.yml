name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install tooling
        run: |
          brew install swiftformat swiftlint
      - name: SwiftFormat (lint mode)
        run: swiftformat Cairn Tests --lint
      - name: SwiftLint
        run: swiftlint --strict

  test:
    runs-on: macos-14
    needs: lint
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build and test
        run: |
          set -o pipefail
          xcodebuild \
            -project Cairn.xcodeproj \
            -scheme Cairn \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            test

  edge-function:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check edge function
        run: deno check supabase/functions/extract-assignments/index.ts
      - name: Test edge-function validators
        run: deno test supabase/functions/extract-assignments/security_test.ts
